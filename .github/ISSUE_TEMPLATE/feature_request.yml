name: Feature request
description: Propose a focused improvement.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution and its CLI or configuration shape.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: I considered privacy and source-code trust boundaries.
          required: true
        - label: I considered Cursor and GitHub Copilot compatibility.
          required: true
        - label: I can help add tests or documentation.
